services:
  - type: web
    name: nola-jazz-whatsapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: STRICT_WEBHOOK_SIGNATURE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_VERIFY_TOKEN
        value: nola-jazz-verify-2027
      - key: GEMINI_API_KEY
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: ALLOWED_PHONE_NUMBERS
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: TRAVELER_NAME
        value: tu padre
