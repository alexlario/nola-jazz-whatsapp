services:
  - type: web
    name: nola-jazz-whatsapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRICT_WEBHOOK_SIGNATURE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: META_VERIFY_TOKEN
        value: nola-jazz-verify-2027
      - key: TWILIO_WHATSAPP_NUMBER
        value: whatsapp:+14155238886
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_PHONE_NUMBERS
        sync: false
      - key: TRAVELER_NAME
        value: tu padre
